version: "3.9"

x-common-env: &common-env
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-trip_planner_db}
  DB_USER: ${DB_USER:-trip_user}

services:
  db:
    image: postgis/postgis:15-3.3
    platform: linux/amd64
    container_name: trip_planner_db
    environment:
      POSTGRES_USER: ${DB_USER:-trip_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-trip_planner_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trip_user} -d ${DB_NAME:-trip_planner_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: trip_planner_backend
    env_file:
      - ./backend/.env
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
